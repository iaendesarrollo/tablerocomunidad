name: Sincronizar hacia GitLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código de GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enviar a GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git config --global user.name "Automatizacion GitHub"
          git config --global user.email "bot@github.com"
          
          git remote add gitlab https://oauth2:${GITLAB_TOKEN}@gitlab.lomasdezamora.gov.ar/pviggiano/tablero_comunidad.git
          
          git push gitlab HEAD:refs/heads/main --force
